<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selam ya 😛</title>
    <!-- Modern ve temiz fontlar ile ikon kütüphanesi -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.8);
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Arka plandaki derinlik hissi veren hafif ışık süzmesi */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.1) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            left: 15%;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 380px;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Kendi açıklamalarını yazacağın metin alanı */
        .description {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 35px;
            text-align: center; /* Paragrafın düzgün durması için sola yasladım */
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-linkedin {
            background-color: #1f242c;
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-linkedin:hover {
            background-color: rgba(88, 166, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- İsmin -->
        <h1>K. Ali Kılıç</h1>
        
        <!-- Burayı istediğin gibi doldurabilirsin bro -->
        <p class="description">
        ekle. 🤙🏿
        </p>

        <!-- Sosyal Medya Butonları -->
        <div class="links-container">
            <!-- href kısımlarına kendi linklerini yapıştırırsın -->
            <a href="https://instagram.com/k.ali.1907/" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://linkedin.com/in/karan-ali-kılıç-877735296/" target="_blank" class="btn btn-linkedin">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
        </div>
    </div>

</body>
</html>
